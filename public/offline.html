<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c3f66">
    <title>You're offline - PSU Intern-Link</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:#1c3f66; color:#e7edf5; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; padding:24px; }
        .card { max-width:360px; text-align:center; background:#1e3f61; border-radius:16px; padding:32px 24px; }
        img { width:72px; height:72px; border-radius:50%; background:#fff; }
        h1 { font-size:1.2rem; margin:16px 0 8px; }
        p { font-size:.9rem; color:#a9bbd1; line-height:1.5; margin:0 0 20px; }
        button { background:#f0b429; color:#1c3f66; border:0; border-radius:10px; padding:12px 22px; font-weight:700; font-size:.95rem; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/psu-logo.png" alt="PSU">
        <h1>You're offline</h1>
        <p>PSU Intern-Link needs an internet connection to load your internship records. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
